# ⚠️  WARNING: This file is NOT the source of truth for deployment.
# The authoritative Kubernetes manifests are managed via GitOps in:
#   jedarden/declarative-config → k8s/apexalgo-iad/vista/
#
# Editing this file will have NO effect on the live cluster.
# These files are retained for reference only and are kept here for historical context.
#
# Last known sync status (2024-08-02):
#   - Image tag: this file shows :1.0.5, live cluster uses :1.0.22
#   - Replicas: this file shows 3, live cluster uses 1
#   - Health check: this file uses "/", live cluster uses "/health"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vista
  namespace: vista
  labels:
    app.kubernetes.io/name: vista
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vista
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vista
        app.kubernetes.io/component: server
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
      - name: vista
        image: ronaldraygun/vista:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
