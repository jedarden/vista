apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vista
  namespace: vista
  labels:
    app.kubernetes.io/name: vista
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vista.jedarden.com`)
      kind: Rule
      services:
        - name: vista
          port: 8080
  tls:
    certResolver: letsencrypt
