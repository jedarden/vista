# ⚠️  WARNING: This file is NOT the source of truth for deployment.
# The authoritative Kubernetes manifests are managed via GitOps in:
#   jedarden/declarative-config → k8s/apexalgo-iad/vista/
#
# Editing this file will have NO effect on the live cluster.
# These files are retained for reference only and are kept here for historical context.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vista
  namespace: vista
  labels:
    app.kubernetes.io/name: vista
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: argocd
  annotations:
    # external-dns (apexalgo-iad, domain-filter jedarden.com, --cloudflare-proxied)
    # creates the vista.jedarden.com CNAME → apexalgo-iad's Cloudflare tunnel,
    # which fronts the cluster's traefik ingress (see traefik/cloudflared-configmap.yml).
    external-dns.alpha.kubernetes.io/hostname: vista.jedarden.com
    external-dns.alpha.kubernetes.io/target: cef7d924-cd61-43dc-89ad-1df7de2699bf.cfargotunnel.com
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vista.jedarden.com`)
      kind: Rule
      services:
        - name: vista
          port: 8080
  tls:
    certResolver: letsencrypt
