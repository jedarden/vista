<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord - Dark Theme</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .screenshot-header {
      text-align: center;
      margin-bottom: 20px;
      color: #e0e0e0;
    }

    .screenshot-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .screenshot-header p {
      font-size: 14px;
      opacity: 0.7;
    }

    .platform-frame-container {
      width: 100%;
      max-width: 600px;
      background: #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .screenshot-footer {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body class="dark-theme">
  <div class="screenshot-header">
    <h1>Discord Platform Frame</h1>
    <p>Theme: Dark | Category: Messaging | Platform: discord</p>
  </div>

  <div class="platform-frame-container" id="frame-container">
    <!-- Frame will be rendered here -->
  </div>

  <div class="screenshot-footer">
    Generated by Vista Dark Theme Screenshot Capture (Bead bf-b6pnm)
  </div>

  <script src="../../src/public/platform-frames.js"></script>
  <script src="../../src/public/app.js"></script>
  <script>
    // Sample content matching bead requirements
    const sampleContent = {
      meta: {
        og: {
          title: 'Comprehensive Platform Frame Testing',
          description: 'This is a detailed description used to test how different platform frames handle content rendering with dark theme.',
          image: 'https://picsum.photos/800/600',
          site_name: 'VistaTest'
        },
        title: 'Comprehensive Platform Frame Testing',
        description: 'This is a detailed description used to test how different platform frames handle content rendering with dark theme.',
        themeColor: '#5865f2'
      },
      imageProbe: {
        dominantColor: '#667eea'
      },
      baseUrl: 'https://example.com/test-article'
    };

    // Render the platform frame using renderPlatformWithContext
    const platformId = 'discord';
    const theme = 'dark';
    const container = document.getElementById('frame-container');

    try {
      const html = renderPlatformWithContext(
        platformId,
        sampleContent.meta,
        sampleContent.imageProbe,
        sampleContent.baseUrl,
        theme,
        sampleContent.imageProbe.dominantColor
      );
      container.innerHTML = html;
      console.log('✅ Frame rendered successfully for discord in dark theme');
    } catch (error) {
      container.innerHTML = '<div style="padding: 20px; color: red;">Error rendering frame: ' + error.message + '</div>';
      console.error('❌ Frame rendering error for discord:', error);
    }
  </script>
</body>
</html>
