<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluesky - Light Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .bluesky-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .bs-post-header {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .bs-post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .bs-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0085ff 0%, #0066cc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #ffffff;
    }

    .bs-author-info {
      flex: 1;
    }

    .bs-author-name {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }

    .bs-author-handle {
      font-size: 13px;
      color: #6b7280;
    }

    .bs-post-time {
      font-size: 12px;
      color: #6b7280;
    }

    .bs-post-content {
      padding: 12px 16px;
    }

    .bs-post-text {
      font-size: 15px;
      line-height: 1.5;
      color: #111827;
      margin-bottom: 12px;
    }

    .bs-link-card {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .bs-link-image {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #0085ff 0%, #0066cc 100%);
    }

    .bs-link-info {
      padding: 12px;
      background: #f3f4f6;
    }

    .bs-link-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .bs-link-domain {
      font-size: 12px;
      color: #6b7280;
    }

    .bs-actions {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
    }

    .bs-action {
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bluesky-context">
    <div class="bs-post-header">
      <div class="bs-post-author">
        <div class="bs-avatar">JD</div>
        <div class="bs-author-info">
          <div class="bs-author-name">John Doe</div>
          <div class="bs-author-handle">@johndoe.bsky.social</div>
        </div>
        <div class="bs-post-time">2h</div>
      </div>
    </div>

    <div class="bs-post-content">
      <div class="bs-post-text">Great resource on modern web development practices. Worth checking out!</div>
      <div class="bs-link-card">
        <div class="bs-link-image"></div>
        <div class="bs-link-info">
          <div class="bs-link-title">Best Practices for Modern Web Development</div>
          <div class="bs-link-domain">website.com</div>
        </div>
      </div>
    </div>

    <div class="bs-actions">
      <div class="bs-action">💬 6</div>
      <div class="bs-action">🔄 8</div>
      <div class="bs-action">❤️ 18</div>
    </div>
  </div>
</body>
</html>
