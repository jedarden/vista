<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord - Light Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'gg sans', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #060607;
    }

    .discord-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .dc-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .dc-message {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .dc-message-dim {
      opacity: 0.6;
    }

    .dc-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #ffffff;
    }

    .dc-message-content {
      flex: 1;
    }

    .dc-message-header {
      margin-bottom: 4px;
    }

    .dc-author-name {
      font-size: 16px;
      font-weight: 600;
      color: #060607;
    }

    .dc-message-time {
      font-size: 12px;
      color: #949ba4;
      margin-left: 8px;
    }

    .dc-message-body {
      font-size: 16px;
      line-height: 1.4;
      color: #060607;
    }

    .dc-link-preview {
      margin-top: 8px;
      background: #f2f3f5;
      border: 1px solid #e3e5e8;
      border-radius: 4px;
      overflow: hidden;
    }

    .dc-link-image {
      width: 100%;
      height: 140px;
      background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
    }

    .dc-link-info {
      padding: 10px 12px;
    }

    .dc-link-title {
      font-size: 15px;
      font-weight: 600;
      color: #00a8fc;
      margin-bottom: 4px;
    }

    .dc-link-domain {
      font-size: 13px;
      color: #949ba4;
    }
  </style>
</head>
<body>
  <div class="discord-context">
    <div class="dc-messages">
      <div class="dc-message dc-message-dim">
        <div class="dc-avatar">PM</div>
        <div class="dc-message-content">
          <div class="dc-message-header">
            <div class="dc-author-name">Project Manager</div>
            <div class="dc-message-time">Today at 9:00 AM</div>
          </div>
          <div class="dc-message-body">You should see this resource I found for the project.</div>
        </div>
      </div>

      <div class="dc-message">
        <div class="dc-avatar">Y</div>
        <div class="dc-message-content">
          <div class="dc-message-header">
            <div class="dc-author-name">You</div>
            <div class="dc-message-time">Today at 9:05 AM</div>
          </div>
          <div class="dc-link-preview">
            <div class="dc-link-image"></div>
            <div class="dc-link-info">
              <div class="dc-link-title">Best Practices for Modern Web Development</div>
              <div class="dc-link-domain">website.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
