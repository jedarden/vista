<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - Light Mode Frame</title>
  <link rel="stylesheet" href="platform-frames-base.css">
  <link rel="stylesheet" href="frames-theme.css">
  <link rel="stylesheet" href="social-platforms-frames.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="context-frame facebook-context light-theme">
    <div class="fb-post-header">
      <div class="fb-avatar">JD</div>
      <div class="fb-post-meta">
        <div class="fb-author-name">John Doe</div>
        <div class="fb-post-time">2h · 🌍</div>
      </div>
      <div class="fb-menu">⋮</div>
    </div>

    <div class="fb-post-content">
      Check out this amazing resource I found! This is exactly what we've been looking for.
    </div>

    <div class="fb-link-preview">
      <div class="fb-context-placeholder">🔗</div>
      <div class="fb-context-domain">WEBSITE.COM</div>
      <div class="fb-context-title">Best Practices for Modern Web Development</div>
      <div class="fb-context-desc">A comprehensive guide to building robust, scalable web applications with modern tools and frameworks.</div>
    </div>

    <div class="fb-post-stats">
      <span>👍 🫶 24</span>
      <span>💬 8 comments</span>
      <span>🔄 5 shares</span>
    </div>
  </div>
</body>
</html>
