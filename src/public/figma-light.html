<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma - Light Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1e1e1e;
    }

    .figma-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .fg-chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .fg-message {
      display: flex;
      margin-bottom: 12px;
    }

    .fg-message-dim {
      opacity: 0.6;
    }

    .fg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f24e1e 0%, #a259ff 100%);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-right: 10px;
    }

    .fg-message-content {
      flex: 1;
    }

    .fg-message-header {
      margin-bottom: 4px;
    }

    .fg-author-name {
      font-size: 14px;
      font-weight: 600;
      color: #1e1e1e;
    }

    .fg-message-time {
      font-size: 11px;
      color: #888888;
      margin-left: 8px;
    }

    .fg-message-body {
      font-size: 14px;
      line-height: 1.4;
      color: #1e1e1e;
    }

    .fg-link-preview {
      margin-top: 8px;
      background: #f5f5f5;
      border-radius: 6px;
      overflow: hidden;
    }

    .fg-link-image {
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, #f24e1e 0%, #a259ff 100%);
    }

    .fg-link-info {
      padding: 8px 10px;
    }

    .fg-link-title {
      font-size: 13px;
      font-weight: 600;
      color: #1e1e1e;
    }

    .fg-link-domain {
      font-size: 11px;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="figma-context">
    <div class="fg-chat">
      <div class="fg-message fg-message-dim">
        <div class="fg-avatar">PM</div>
        <div class="fg-message-content">
          <div class="fg-message-header">
            <div class="fg-author-name">Project Manager</div>
            <div class="fg-message-time">2:00 PM</div>
          </div>
          <div class="fg-message-body">You should see this resource I found for the project.</div>
        </div>
      </div>

      <div class="fg-message">
        <div class="fg-avatar">Y</div>
        <div class="fg-message-content">
          <div class="fg-message-header">
            <div class="fg-author-name">You</div>
            <div class="fg-message-time">2:05 PM</div>
          </div>
          <div class="fg-link-preview">
            <div class="fg-link-image"></div>
            <div class="fg-link-info">
              <div class="fg-link-title">Best Practices for Modern Web Development</div>
              <div class="fg-link-domain">website.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
