<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KakaoTalk - Dark Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #1e1e1e;
      color: #ffffff;
    }

    .kakaotalk-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #151515;
      border-radius: 8px;
      overflow: hidden;
    }

    .kt-chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .kt-message {
      display: flex;
      margin-bottom: 10px;
    }

    .kt-message-dim {
      opacity: 0.6;
    }

    .kt-message-received {
      justify-content: flex-start;
    }

    .kt-message-sent {
      justify-content: flex-end;
    }

    .kt-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
    }

    .kt-bubble-received {
      background: #3c3c3c;
      color: #ffffff;
    }

    .kt-bubble-sent {
      background: #fae000;
      color: #000000;
    }

    .kt-sender-name {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .kt-message-body {
      font-size: 14px;
      line-height: 1.4;
      color: #ffffff;
    }

    .kt-link-preview {
      margin-top: 8px;
      background: #252525;
      border-radius: 8px;
      overflow: hidden;
    }

    .kt-link-image {
      width: 100%;
      height: 100px;
      background: linear-gradient(135deg, #fae000 0%, #e5c800 100%);
    }

    .kt-link-info {
      padding: 8px 10px;
    }

    .kt-link-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .kt-link-domain {
      font-size: 11px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="kakaotalk-context">
    <div class="kt-chat">
      <div class="kt-message kt-message-received kt-message-dim">
        <div class="kt-bubble kt-bubble-received">
          <div class="kt-sender-name">Project Manager</div>
          <div class="kt-message-body">You should see this resource I found for the project.</div>
        </div>
      </div>

      <div class="kt-message kt-message-sent">
        <div class="kt-bubble kt-bubble-sent">
          <div class="kt-message-body">Thanks! Let me check it out.</div>
        </div>
      </div>

      <div class="kt-message kt-message-sent">
        <div class="kt-bubble kt-bubble-sent">
          <div class="kt-link-preview">
            <div class="kt-link-image"></div>
            <div class="kt-link-info">
              <div class="kt-link-title">Best Practices for Modern Web Development</div>
              <div class="kt-link-domain">website.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
