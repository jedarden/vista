<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn - Dark Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #000000;
      color: #e0e0e0;
    }

    .linkedin-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
    }

    .li-post-header {
      padding: 16px;
      background: #000000;
    }

    .li-post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .li-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .li-author-info {
      flex: 1;
    }

    .li-author-name {
      font-size: 15px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .li-author-headline {
      font-size: 13px;
      color: #a0a0a0;
    }

    .li-post-content {
      padding: 0 16px 16px;
    }

    .li-post-text {
      font-size: 14px;
      line-height: 1.6;
      color: #e0e0e0;
      margin-bottom: 12px;
    }

    .li-link-card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }

    .li-link-image {
      width: 100%;
      height: 160px;
      background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
    }

    .li-link-info {
      padding: 12px;
      background: #1a1a1a;
    }

    .li-link-title {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 4px;
    }

    .li-link-domain {
      font-size: 12px;
      color: #a0a0a0;
    }

    .li-actions {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      border-top: 1px solid #2a2a2a;
    }

    .li-action {
      font-size: 13px;
      color: #a0a0a0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="linkedin-context">
    <div class="li-post-header">
      <div class="li-post-author">
        <div class="li-avatar">JD</div>
        <div class="li-author-info">
          <div class="li-author-name">John Doe</div>
          <div class="li-author-headline">Senior Software Engineer</div>
        </div>
      </div>
    </div>

    <div class="li-post-content">
      <div class="li-post-text">Great resource on web development best practices. Worth a read for anyone working in the field!</div>
      <div class="li-link-card">
        <div class="li-link-image"></div>
        <div class="li-link-info">
          <div class="li-link-title">Best Practices for Modern Web Development</div>
          <div class="li-link-domain">website.com</div>
        </div>
      </div>
    </div>

    <div class="li-actions">
      <div class="li-action">👍 24</div>
      <div class="li-action">💬 8</div>
      <div class="li-action">🔄 5</div>
    </div>
  </div>
</body>
</html>
