<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinterest - Light Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .pinterest-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .pt-pin-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .pt-pin-image {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #e60023 0%, #b01c36 100%);
      flex-shrink: 0;
    }

    .pt-pin-info {
      padding: 12px;
      background: #ffffff;
      flex: 1;
    }

    .pt-pin-title {
      font-size: 14px;
      font-weight: 600;
      color: #111111;
      margin-bottom: 8px;
    }

    .pt-pin-description {
      font-size: 12px;
      color: #666666;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .pt-pin-author {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #e0e0e0;
    }

    .pt-author-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e60023 0%, #b01c36 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #ffffff;
    }

    .pt-author-name {
      font-size: 12px;
      color: #666666;
    }

    .pt-actions {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #ffffff;
      border-top: 1px solid #e0e0e0;
    }

    .pt-action {
      font-size: 12px;
      color: #666666;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="pinterest-context">
    <div class="pt-pin-card">
      <div class="pt-pin-image"></div>
      <div class="pt-pin-info">
        <div class="pt-pin-title">Best Practices for Modern Web Development</div>
        <div class="pt-pin-description">Essential techniques and strategies for building scalable web applications</div>
        <div class="pt-pin-author">
          <div class="pt-author-avatar">JD</div>
          <div class="pt-author-name">johndoe</div>
        </div>
      </div>
      <div class="pt-actions">
        <div class="pt-action">💾 156 saves</div>
        <div class="pt-action">❤️ 42 likes</div>
      </div>
    </div>
  </div>
</body>
</html>
