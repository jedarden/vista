<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal - Dark Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #1c1c1e;
      color: #ffffff;
    }

    .signal-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #0d0d0d;
      border-radius: 8px;
      overflow: hidden;
    }

    .sg-chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .sg-message {
      display: flex;
      margin-bottom: 12px;
    }

    .sg-message-dim {
      opacity: 0.6;
    }

    .sg-message-received {
      justify-content: flex-start;
    }

    .sg-message-sent {
      justify-content: flex-end;
    }

    .sg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 20px;
    }

    .sg-bubble-received {
      background: #2c2c2e;
      color: #ffffff;
    }

    .sg-bubble-sent {
      background: #2c6cd5;
      color: #ffffff;
    }

    .sg-sender-name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .sg-message-body {
      font-size: 15px;
      line-height: 1.4;
      color: #ffffff;
    }

    .sg-link-preview {
      margin-top: 8px;
      background: #1c1c1e;
      border-radius: 10px;
      overflow: hidden;
    }

    .sg-link-image {
      width: 100%;
      height: 110px;
      background: linear-gradient(135deg, #2c6cd5 0%, #1a4db8 100%);
    }

    .sg-link-info {
      padding: 8px 10px;
    }

    .sg-link-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .sg-link-domain {
      font-size: 11px;
      color: #8e8e93;
    }
  </style>
</head>
<body>
  <div class="signal-context">
    <div class="sg-chat">
      <div class="sg-message sg-message-received sg-message-dim">
        <div class="sg-bubble sg-bubble-received">
          <div class="sg-sender-name">Project Manager</div>
          <div class="sg-message-body">You should see this resource I found for the project.</div>
        </div>
      </div>

      <div class="sg-message sg-message-sent">
        <div class="sg-bubble sg-bubble-sent">
          <div class="sg-message-body">Thanks! Let me check it out.</div>
        </div>
      </div>

      <div class="sg-message sg-message-sent">
        <div class="sg-bubble sg-bubble-sent">
          <div class="sg-link-preview">
            <div class="sg-link-image"></div>
            <div class="sg-link-info">
              <div class="sg-link-title">Best Practices for Modern Web Development</div>
              <div class="sg-link-domain">website.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
