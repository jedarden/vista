<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Teams - Dark Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #1f1f1f;
      color: #ffffff;
    }

    .teams-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #1f1f1f;
      border-radius: 8px;
      overflow: hidden;
    }

    .tm-chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .tm-message {
      display: flex;
      margin-bottom: 16px;
    }

    .tm-message-dim {
      opacity: 0.6;
    }

    .tm-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6264a7 0%, #464775 100%);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-right: 10px;
    }

    .tm-message-content {
      flex: 1;
    }

    .tm-message-header {
      margin-bottom: 4px;
    }

    .tm-author-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .tm-message-time {
      font-size: 12px;
      color: #a0a0a0;
      margin-left: 8px;
    }

    .tm-message-body {
      font-size: 14px;
      line-height: 1.4;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .tm-link-preview {
      background: #2d2d2d;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      overflow: hidden;
    }

    .tm-link-image {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #6264a7 0%, #464775 100%);
    }

    .tm-link-info {
      padding: 10px 12px;
    }

    .tm-link-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .tm-link-domain {
      font-size: 12px;
      color: #a0a0a0;
    }
  </style>
</head>
<body>
  <div class="teams-context">
    <div class="tm-chat">
      <div class="tm-message tm-message-dim">
        <div class="tm-avatar">PM</div>
        <div class="tm-message-content">
          <div class="tm-message-header">
            <div class="tm-author-name">Project Manager</div>
            <div class="tm-message-time">9:00 AM</div>
          </div>
          <div class="tm-message-body">You should see this resource I found for the project.</div>
        </div>
      </div>

      <div class="tm-message">
        <div class="tm-avatar">Y</div>
        <div class="tm-message-content">
          <div class="tm-message-header">
            <div class="tm-author-name">You</div>
            <div class="tm-message-time">9:05 AM</div>
          </div>
          <div class="tm-link-preview">
            <div class="tm-link-image"></div>
            <div class="tm-link-info">
              <div class="tm-link-title">Best Practices for Modern Web Development</div>
              <div class="tm-link-domain">website.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
