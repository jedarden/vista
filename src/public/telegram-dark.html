<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram - Dark Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #1e1e1e;
      color: #ffffff;
    }

    .telegram-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #0f0f0f;
      border-radius: 8px;
      overflow: hidden;
    }

    .tg-chat {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
    }

    .tg-message {
      display: flex;
      margin-bottom: 8px;
    }

    .tg-message-dim {
      opacity: 0.6;
    }

    .tg-message-received {
      justify-content: flex-start;
    }

    .tg-message-sent {
      justify-content: flex-end;
    }

    .tg-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .tg-bubble-received {
      background: #2b2b2b;
      color: #ffffff;
    }

    .tg-bubble-sent {
      background: #8774e1;
      color: #ffffff;
    }

    .tg-sender-name {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .tg-message-body {
      font-size: 15px;
      line-height: 1.4;
      color: #ffffff;
    }

    .tg-link-preview {
      margin-top: 8px;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
    }

    .tg-link-image {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #8774e1 0%, #6a5acd 100%);
    }

    .tg-link-info {
      padding: 8px 10px;
    }

    .tg-link-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .tg-link-domain {
      font-size: 12px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="telegram-context">
    <div class="tg-chat">
      <div class="tg-message tg-message-received tg-message-dim">
        <div class="tg-bubble tg-bubble-received">
          <div class="tg-sender-name">Project Manager</div>
          <div class="tg-message-body">You should see this resource I found for the project.</div>
        </div>
      </div>

      <div class="tg-message tg-message-sent">
        <div class="tg-bubble tg-bubble-sent">
          <div class="tg-message-body">Thanks! Let me check it out.</div>
        </div>
      </div>

      <div class="tg-message tg-message-sent">
        <div class="tg-bubble tg-bubble-sent">
          <div class="tg-link-preview">
            <div class="tg-link-image"></div>
            <div class="tg-link-info">
              <div class="tg-link-title">Best Practices for Modern Web Development</div>
              <div class="tg-link-domain">website.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
