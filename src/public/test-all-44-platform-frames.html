<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All 44 Platform Context Frames Test</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="frames-theme.css">
  <link rel="stylesheet" href="frame-layouts.css">
  <style>
    .test-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .test-controls {
      position: sticky;
      top: 10px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 8px;
      z-index: 1000;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .test-controls.light-mode {
      background: #f5f5f5;
    }
    .test-controls h1 {
      margin: 0;
      font-size: 1.2rem;
      margin-right: 20px;
    }
    .test-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .test-btn:hover {
      opacity: 0.8;
    }
    .btn-theme {
      background: #007bff;
      color: white;
    }
    .btn-toggle-all {
      background: #28a745;
      color: white;
    }
    .btn-card-only {
      background: #ffc107;
      color: black;
    }
    .btn-context {
      background: #17a2b8;
      color: white;
    }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .platform-test-item {
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1a1a;
    }
    .light-mode .platform-test-item {
      background: #ffffff;
      border-color: #ddd;
    }
    .platform-header {
      padding: 10px;
      background: #2a2a2a;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .light-mode .platform-header {
      background: #f0f0f0;
      color: black;
      border-bottom: 1px solid #ddd;
    }
    .platform-controls {
      display: flex;
      gap: 5px;
    }
    .platform-controls button {
      padding: 4px 8px;
      font-size: 0.75rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .platform-card-wrapper {
      position: relative;
      min-height: 200px;
      padding: 10px;
    }
    .test-status {
      padding: 5px 10px;
      font-size: 0.8rem;
      text-align: center;
      background: #333;
      color: #888;
    }
    .light-mode .test-status {
      background: #f9f9f9;
      color: #666;
    }
    .status-working { color: #28a745; }
    .status-failed { color: #dc3545; }
    .status-pending { color: #ffc107; }

    .test-summary {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .light-mode .test-summary {
      background: #f0f0f0;
    }
    .test-summary h3 {
      margin: 0 0 10px 0;
    }
    .summary-stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-label {
      font-weight: bold;
    }
  </style>
</head>
<body class="dark-mode">
  <div class="test-container">
    <div class="test-controls" id="testControls">
      <h1>🧪 Platform Frames Test</h1>
      <button class="test-btn btn-theme" id="themeToggle" aria-label="Toggle dark/light mode">🌙 Dark Mode</button>
      <button class="test-btn btn-toggle-all" id="expandAll" aria-label="Expand all platform frames">↕️ Expand All</button>
      <button class="test-btn btn-card-only" id="cardOnlyAll" aria-label="Show card-only view for all platforms">📄 Card Only All</button>
      <button class="test-btn btn-context" id="contextAll" aria-label="Show context view for all platforms">🖼️ Context All</button>
      <span style="margin-left: auto; font-size: 0.9rem;">Testing 44 platforms</span>
    </div>

    <div class="test-summary">
      <h3>Test Summary</h3>
      <div class="summary-stats">
        <div class="stat-item">
          <span class="stat-label">Total:</span>
          <span id="totalStat">44</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Working:</span>
          <span id="workingStat" class="status-working">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Failed:</span>
          <span id="failedStat" class="status-failed">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Pending:</span>
          <span id="pendingStat" class="status-pending">44</span>
        </div>
      </div>
    </div>

    <div class="test-grid" id="testGrid"></div>
  </div>

  <script src="platform-frames.js"></script>
  <script>
    // All 44 platforms
    const ALL_PLATFORMS = [
      { id: 'google', name: 'Google Search', category: 'social' },
      { id: 'facebook', name: 'Facebook', category: 'social' },
      { id: 'twitter', name: 'X (Twitter)', category: 'social' },
      { id: 'linkedin', name: 'LinkedIn', category: 'social' },
      { id: 'instagram', name: 'Instagram', category: 'social' },
      { id: 'youtube', name: 'YouTube', category: 'social' },
      { id: 'slack', name: 'Slack', category: 'messaging' },
      { id: 'discord', name: 'Discord', category: 'messaging' },
      { id: 'imessage', name: 'iMessage', category: 'messaging' },
      { id: 'whatsapp', name: 'WhatsApp', category: 'messaging' },
      { id: 'telegram', name: 'Telegram', category: 'messaging' },
      { id: 'signal', name: 'Signal', category: 'messaging' },
      { id: 'microsoft-teams', name: 'Microsoft Teams', category: 'messaging' },
      { id: 'google-chat', name: 'Google Chat', category: 'messaging' },
      { id: 'zoom-chat', name: 'Zoom Chat', category: 'messaging' },
      { id: 'line', name: 'Line', category: 'messaging' },
      { id: 'kakao', name: 'KakaoTalk', category: 'messaging' },
      { id: 'tiktok', name: 'TikTok', category: 'social' },
      { id: 'pinterest', name: 'Pinterest', category: 'social' },
      { id: 'bluesky', name: 'Bluesky', category: 'social' },
      { id: 'mastodon', name: 'Mastodon', category: 'social' },
      { id: 'threads', name: 'Threads', category: 'social' },
      { id: 'tumblr', name: 'Tumblr', category: 'social' },
      { id: 'reddit', name: 'Reddit', category: 'social' },
      { id: 'github', name: 'GitHub', category: 'devtools' },
      { id: 'gitlab', name: 'GitLab', category: 'devtools' },
      { id: 'stackoverflow', name: 'Stack Overflow', category: 'devtools' },
      { id: 'hackernews', name: 'Hacker News', category: 'devtools' },
      { id: 'producthunt', name: 'Product Hunt', category: 'devtools' },
      { id: 'devto', name: 'Dev.to', category: 'devtools' },
      { id: 'medium', name: 'Medium', category: 'content' },
      { id: 'gmail', name: 'Gmail', category: 'email' },
      { id: 'outlook', name: 'Outlook', category: 'email' },
      { id: 'feedly', name: 'Feedly', category: 'rss' },
      { id: 'notion', name: 'Notion', category: 'productivity' },
      { id: 'evernote', name: 'Evernote', category: 'productivity' },
      { id: 'vscode', name: 'VS Code', category: 'productivity' },
      { id: 'jetbrains-ide', name: 'JetBrains IDE', category: 'productivity' },
      { id: 'jira', name: 'Jira', category: 'productivity' },
      { id: 'trello', name: 'Trello', category: 'productivity' },
      { id: 'asana', name: 'Asana', category: 'productivity' },
      { id: 'figma', name: 'Figma', category: 'productivity' },
      { id: 'substack', name: 'Substack', category: 'content' },
      { id: 'generic', name: 'Generic Platform', category: 'other' }
    ];

    // Test results
    const testResults = {
      total: ALL_PLATFORMS.length,
      working: 0,
      failed: 0,
      pending: ALL_PLATFORMS.length,
      failures: {}
    };

    // DOM elements
    const themeToggle = document.getElementById('themeToggle');
    const expandAllBtn = document.getElementById('expandAll');
    const cardOnlyAllBtn = document.getElementById('cardOnlyAll');
    const contextAllBtn = document.getElementById('contextAll');
    const testGrid = document.getElementById('testGrid');
    const testControls = document.getElementById('testControls');

    // Initialize test grid
    function initTestGrid() {
      testGrid.innerHTML = '';

      ALL_PLATFORMS.forEach(platform => {
        const testItem = document.createElement('div');
        testItem.className = 'platform-test-item';
        testItem.id = `test-${platform.id}`;

        testItem.innerHTML = `
          <div class="platform-header">
            <span>${platform.name}</span>
            <span style="font-size: 0.8rem; opacity: 0.7;">${platform.category}</span>
          </div>
          <div class="platform-card-wrapper" id="wrapper-${platform.id}">
            <div class="test-status status-pending" id="status-${platform.id}">Testing...</div>
          </div>
        `;

        testGrid.appendChild(testItem);

        // Test each platform
        testPlatform(platform);
      });
    }

    // Test individual platform
    function testPlatform(platform) {
      const wrapper = document.getElementById(`wrapper-${platform.id}`);
      const statusEl = document.getElementById(`status-${platform.id}`);

      try {
        // Test if platform frame exists
        if (typeof PLATFORM_FRAMES !== 'undefined' && PLATFORM_FRAMES[platform.id]) {
          const frameData = PLATFORM_FRAMES[platform.id];

          // Create a sample card
          const sampleCard = createSampleCard(platform);

          // Render with context frame
          const cardWithFrame = renderPlatformCard(platform.id, sampleCard, true);
          wrapper.innerHTML = cardWithFrame;

          // Update status to working
          statusEl.className = 'test-status status-working';
          statusEl.textContent = '✓ Working';
          testResults.working++;
          testResults.pending--;

        } else {
          // Platform frame not found
          statusEl.className = 'test-status status-failed';
          statusEl.textContent = '✗ Missing from platform-frames.js';
          testResults.failed++;
          testResults.pending--;
          testResults.failures[platform.id] = 'Missing from platform-frames.js';
        }
      } catch (error) {
        // Error during rendering
        statusEl.className = 'test-status status-failed';
        statusEl.textContent = `✗ Error: ${error.message}`;
        testResults.failed++;
        testResults.pending--;
        testResults.failures[platform.id] = error.message;
      }

      updateStats();
    }

    // Create sample card data
    function createSampleCard(platform) {
      return {
        title: `Test Title for ${platform.name}`,
        description: `This is a sample description to test the ${platform.name} platform frame rendering.`,
        url: `https://example.com/test-${platform.id}`,
        domain: 'example.com',
        image: 'https://picsum.photos/800/600',
        favicon: '🌐',
        author: `Test User`,
        handle: `@testuser`,
        timestamp: '2h'
      };
    }

    // Render platform card with context frame
    function renderPlatformCard(platformId, cardData, withContext) {
      if (typeof PLATFORM_FRAMES === 'undefined' || !PLATFORM_FRAMES[platformId]) {
        return `<div style="padding: 20px; text-align: center; color: #888;">Platform frame not found</div>`;
      }

      const frameData = PLATFORM_FRAMES[platformId];
      const cardHtml = renderSimpleCard(cardData);

      if (!withContext) {
        return cardHtml;
      }

      // Apply theme vars
      const isDarkMode = document.body.classList.contains('dark-mode');
      const themeVars = isDarkMode ? frameData.themeVars.dark : frameData.themeVars.light;
      const themeStyle = Object.entries(themeVars)
        .map(([key, value]) => `${key}: ${value};`)
        .join(' ');

      // Replace placeholder in chrome
      const chrome = frameData.chrome.replace('{{mainResult}}', cardHtml);
      const neutralContent = frameData.neutralContent
        .replace('{{title}}', cardData.title)
        .replace('{{description}}', cardData.description)
        .replace('{{domain}}', cardData.domain)
        .replace('{{url}}', cardData.url);

      return `
        <div class="${platformId}-context platform-context-frame" style="${themeStyle}">
          ${frameData.chrome.replace('{{mainResult}}', cardHtml)}
        </div>
      `;
    }

    // Render simple card (without context frame)
    function renderSimpleCard(cardData) {
      return `
        <div class="simple-card" style="
          padding: 12px;
          border: 1px solid #333;
          border-radius: 8px;
          background: #252525;
        ">
          <div style="display: flex; gap: 12px;">
            ${cardData.favicon ? `<div style="font-size: 24px;">${cardData.favicon}</div>` : ''}
            <div style="flex: 1;">
              <div style="font-weight: 600; margin-bottom: 4px; color: #fff;">${cardData.title}</div>
              <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 8px;">${cardData.description}</div>
              <div style="font-size: 0.75rem; color: #888;">${cardData.domain}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Update statistics
    function updateStats() {
      document.getElementById('totalStat').textContent = testResults.total;
      document.getElementById('workingStat').textContent = testResults.working;
      document.getElementById('failedStat').textContent = testResults.failed;
      document.getElementById('pendingStat').textContent = testResults.pending;
    }

    // Toggle theme
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      document.body.classList.toggle('light-mode');
      testControls.classList.toggle('light-mode');

      const isDarkMode = document.body.classList.contains('dark-mode');
      themeToggle.textContent = isDarkMode ? '🌙 Dark Mode' : '☀️ Light Mode';

      // Re-render all cards with new theme
      ALL_PLATFORMS.forEach(platform => {
        const wrapper = document.getElementById(`wrapper-${platform.id}`);
        const statusEl = document.getElementById(`status-${platform.id}`);

        if (statusEl.classList.contains('status-working')) {
          const cardData = createSampleCard(platform);
          wrapper.innerHTML = renderPlatformCard(platform.id, cardData, true);
        }
      });
    });

    // Toggle all to context mode
    expandAllBtn.addEventListener('click', () => {
      // Currently same as context all
      contextAllBtn.click();
    });

    // Card only all
    cardOnlyAllBtn.addEventListener('click', () => {
      ALL_PLATFORMS.forEach(platform => {
        const wrapper = document.getElementById(`wrapper-${platform.id}`);
        const statusEl = document.getElementById(`status-${platform.id}`);

        if (statusEl.classList.contains('status-working')) {
          const cardData = createSampleCard(platform);
          wrapper.innerHTML = renderPlatformCard(platform.id, cardData, false);
        }
      });
    });

    // Context all
    contextAllBtn.addEventListener('click', () => {
      ALL_PLATFORMS.forEach(platform => {
        const wrapper = document.getElementById(`wrapper-${platform.id}`);
        const statusEl = document.getElementById(`status-${platform.id}`);

        if (statusEl.classList.contains('status-working')) {
          const cardData = createSampleCard(platform);
          wrapper.innerHTML = renderPlatformCard(platform.id, cardData, true);
        }
      });
    });

    // Initialize on load
    initTestGrid();
  </script>
</body>
</html>
