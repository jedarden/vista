<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Hunt Platform Frame - Comment Section with Voting UI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .test-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .test-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .test-header h1 {
      color: #21293c;
      margin-bottom: 8px;
    }
    .test-header p {
      color: #5f6b7c;
      margin: 0;
    }
    .theme-toggle-container {
      text-align: center;
      margin-bottom: 30px;
    }
    .theme-toggle {
      padding: 12px 24px;
      background: #da552f;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .theme-toggle:hover {
      background: #c44a2a;
    }
    .theme-info {
      margin-top: 12px;
      font-size: 13px;
      color: #5f6b7c;
    }
    .frame-section {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .frame-section h2 {
      margin-top: 0;
      color: #21293c;
      font-size: 18px;
      margin-bottom: 16px;
    }
    .ph-demo {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <h1>Product Hunt Frame Test</h1>
      <p>Testing Product Hunt's comment section with voting UI and dark/light mode support</p>
    </div>

    <div class="theme-toggle-container">
      <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme (Current: <span id="current-theme">Light</span>)</button>
      <div class="theme-info">Click to switch between dark and light modes</div>
    </div>

    <!-- Product Hunt Demo 1: Tech Product Launch -->
    <div class="frame-section">
      <h2>Sample 1: AI Content Platform</h2>
      <div class="ph-demo" id="ph-demo-1"></div>
    </div>

    <!-- Product Hunt Demo 2: Developer Tool -->
    <div class="frame-section">
      <h2>Sample 2: Developer CLI Tool</h2>
      <div class="ph-demo" id="ph-demo-2"></div>
    </div>

    <!-- Product Hunt Demo 3: Productivity App -->
    <div class="frame-section">
      <h2>Sample 3: Team Collaboration App</h2>
      <div class="ph-demo" id="ph-demo-3"></div>
    </div>

    <!-- Voting UI Test -->
    <div class="frame-section">
      <h2>Voting UI Details</h2>
      <div class="ph-demo" id="ph-demo-voting"></div>
    </div>
  </div>

  <script src="platform-frames.js"></script>
  <script>
    let currentTheme = 'light';

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', currentTheme);
      document.getElementById('current-theme').textContent =
        currentTheme === 'light' ? 'Light' : 'Dark';
      renderAllDemos();
    }

    function renderProductHuntDemo(container, content) {
      container.innerHTML = buildContextFrame('producthunt', content, currentTheme);
    }

    function renderDemo1() {
      const container = document.getElementById('ph-demo-1');
      const content = {
        productName: 'AI Content Assistant',
        tagline: 'Generate blog posts, social media content, and more with AI',
        comment: 'This looks amazing! Exactly what I needed for my content workflow. The AI suggestions are incredibly helpful!'
      };
      renderProductHuntDemo(container, content);
    }

    function renderDemo2() {
      const container = document.getElementById('ph-demo-2');
      const content = {
        productName: 'DevFlow CLI',
        tagline: 'Automate your development workflow with powerful command-line tools',
        comment: 'Finally! A CLI that actually understands how developers work. The integration with Git is seamless.'
      };
      renderProductHuntDemo(container, content);
    }

    function renderDemo3() {
      const container = document.getElementById('ph-demo-3');
      const content = {
        productName: 'TeamSync Pro',
        tagline: 'Real-time collaboration platform for remote teams',
        comment: 'Our team has been using this for a week and productivity is up 40%. Highly recommend for distributed teams!'
      };
      renderProductHuntDemo(container, content);
    }

    function renderVotingDemo() {
      const container = document.getElementById('ph-demo-voting');
      const content = {
        productName: 'VoteCounter Demo',
        tagline: 'Demonstrating Product Hunt\'s signature upvote button and comment threading',
        comment: 'The upvote button shows the voting UI clearly, and the comment section demonstrates threaded discussions with user avatars and timestamps.'
      };
      renderProductHuntDemo(container, content);
    }

    function renderAllDemos() {
      renderDemo1();
      renderDemo2();
      renderDemo3();
      renderVotingDemo();
    }

    // Initial render
    document.body.setAttribute('data-theme', currentTheme);
    renderAllDemos();
  </script>
</body>
</html>
