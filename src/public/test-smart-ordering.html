<!DOCTYPE html>
<html>
<head>
  <title>VISTA Smart Ordering Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    .success { color: green; }
    .error { color: red; }
    .info { color: blue; }
  </style>
</head>
<body>
  <h1>VISTA Smart Ordering Test</h1>
  <div id="test-results"></div>

  <iframe id="vista-frame" src="http://localhost:3000" style="width: 100%; height: 600px; border: 1px solid #ccc;"></iframe>

  <script>
    const results = document.getElementById('test-results');

    function addResult(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `test-section ${type}`;
      div.textContent = message;
      results.appendChild(div);
    }

    // Test 1: Check if server is responding
    addResult('Test 1: Checking if VISTA server is running...', 'info');
    fetch('http://localhost:3000/api/health')
      .then(res => res.json())
      .then(data => {
        addResult('✓ Server health check passed: ' + JSON.stringify(data), 'success');
      })
      .catch(err => {
        addResult('✗ Server health check failed: ' + err.message, 'error');
      });

    // Test 2: Check if app.js loads
    addResult('Test 2: Checking if app.js loads...', 'info');
    fetch('http://localhost:3000/app.js')
      .then(res => {
        if (res.ok) {
          addResult('✓ app.js is accessible', 'success');
          return res.text();
        } else {
          addResult('✗ app.js returned status: ' + res.status, 'error');
        }
      })
      .then(content => {
        if (content && content.includes('smartOrdering')) {
          addResult('✓ app.js contains smartOrdering code', 'success');
          if (content.includes('smartOrdering: true')) {
            addResult('✓ smartOrdering is enabled by default', 'success');
          }
        } else if (content) {
          addResult('✗ app.js does not contain smartOrdering code', 'error');
        }
      })
      .catch(err => {
        addResult('✗ Failed to fetch app.js: ' + err.message, 'error');
      });

    // Test 3: Test API endpoint with sample URL
    addResult('Test 3: Testing API preview endpoint with sample URL...', 'info');
    fetch('http://localhost:3000/api/preview/meta?url=https://example.com')
      .then(res => res.json())
      .then(data => {
        if (data.meta && data.scoring) {
          addResult('✓ API endpoint returns valid data with meta and scoring', 'success');
        } else {
          addResult('✗ API response missing meta or scoring', 'error');
        }
      })
      .catch(err => {
        addResult('✗ API request failed: ' + err.message, 'error');
      });

    // Test 4: Check platform list endpoint
    addResult('Test 4: Testing platform list endpoint...', 'info');
    fetch('http://localhost:3000/api/platforms')
      .then(res => res.json())
      .then(data => {
        if (data.platforms && Array.isArray(data.platforms)) {
          addResult(`✓ Platform list endpoint returns ${data.platforms.length} platforms`, 'success');
        } else {
          addResult('✗ Platform list response is invalid', 'error');
        }
      })
      .catch(err => {
        addResult('✗ Platform list request failed: ' + err.message, 'error');
      });

    // Monitor iframe for errors
    const iframe = document.getElementById('vista-frame');
    iframe.onload = function() {
      addResult('✓ VISTA application loaded in iframe', 'success');
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const hasAppScript = iframeDoc.querySelector('script[src="app.js"]');
        if (hasAppScript) {
          addResult('✓ app.js script tag found in loaded page', 'success');
        } else {
          addResult('✗ app.js script tag not found in loaded page', 'error');
        }
      } catch (e) {
        addResult('⚠ Cannot access iframe content (CORS restriction), but iframe loaded successfully', 'info');
      }
    };

    iframe.onerror = function() {
      addResult('✗ Failed to load VISTA application in iframe', 'error');
    };

    addResult('All tests initiated. Waiting for results...', 'info');
  </script>
</body>
</html>
