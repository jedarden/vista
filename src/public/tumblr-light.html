<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tumblr - Light Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #001021;
    }

    .tumblr-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .tm-post-header {
      padding: 16px;
      background: #ffffff;
    }

    .tm-post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tm-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b8ff 0%, #0095d9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #ffffff;
    }

    .tm-author-name {
      font-size: 15px;
      font-weight: 700;
      color: #001021;
    }

    .tm-post-time {
      font-size: 12px;
      color: #6a6a6a;
    }

    .tm-post-content {
      padding: 0 16px 16px;
    }

    .tm-post-text {
      font-size: 15px;
      line-height: 1.5;
      color: #001021;
      margin-bottom: 12px;
    }

    .tm-link-card {
      background: #f5f5f5;
      border-radius: 8px;
      overflow: hidden;
    }

    .tm-link-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #00b8ff 0%, #0095d9 100%);
    }

    .tm-link-info {
      padding: 12px;
      background: #f5f5f5;
    }

    .tm-link-title {
      font-size: 15px;
      font-weight: 600;
      color: #001021;
      margin-bottom: 4px;
    }

    .tm-link-domain {
      font-size: 12px;
      color: #6a6a6a;
    }

    .tm-tags {
      padding: 12px 16px;
      border-top: 1px solid #e0e0e0;
    }

    .tm-tag {
      display: inline-block;
      font-size: 13px;
      color: #0095d9;
      margin-right: 8px;
      cursor: pointer;
    }

    .tm-actions {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      border-top: 1px solid #e0e0e0;
    }

    .tm-action {
      font-size: 13px;
      color: #6a6a6a;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tumblr-context">
    <div class="tm-post-header">
      <div class="tm-post-author">
        <div class="tm-avatar">JD</div>
        <div class="tm-author-name">johndoe</div>
        <div class="tm-post-time">2 hours ago</div>
      </div>
    </div>

    <div class="tm-post-content">
      <div class="tm-post-text">Check out this great resource on web development!</div>
      <div class="tm-link-card">
        <div class="tm-link-image"></div>
        <div class="tm-link-info">
          <div class="tm-link-title">Best Practices for Modern Web Development</div>
          <div class="tm-link-domain">website.com</div>
        </div>
      </div>
    </div>

    <div class="tm-tags">
      <span class="tm-tag">#webdev</span>
      <span class="tm-tag">#programming</span>
      <span class="tm-tag">#learning</span>
    </div>

    <div class="tm-actions">
      <div class="tm-action">💬 4</div>
      <div class="tm-action">❤️ 28</div>
      <div class="tm-action">🔄 12</div>
    </div>
  </div>
</body>
</html>
