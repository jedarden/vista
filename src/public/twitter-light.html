<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X (Twitter) - Light Mode Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0f1419;
    }

    .twitter-context {
      display: flex;
      flex-direction: column;
      min-height: 400px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }

    .tw-post-header {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #eff3f4;
    }

    .tw-post-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .tw-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #ffffff;
    }

    .tw-author-info {
      flex: 1;
    }

    .tw-author-name {
      font-size: 15px;
      font-weight: 700;
      color: #0f1419;
    }

    .tw-author-handle {
      font-size: 14px;
      color: #536471;
    }

    .tw-post-time {
      font-size: 13px;
      color: #536471;
    }

    .tw-post-content {
      padding: 12px 16px;
    }

    .tw-post-text {
      font-size: 15px;
      line-height: 1.5;
      color: #0f1419;
      margin-bottom: 12px;
    }

    .tw-link-card {
      background: #f7f9f9;
      border: 1px solid #eff3f4;
      border-radius: 16px;
      overflow: hidden;
    }

    .tw-link-image {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1d9bf0 0%, #1a8cd8 100%);
    }

    .tw-link-info {
      padding: 12px;
      background: #f7f9f9;
    }

    .tw-link-domain {
      font-size: 13px;
      color: #536471;
      margin-bottom: 4px;
    }

    .tw-link-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f1419;
    }

    .tw-actions {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid #eff3f4;
    }

    .tw-action {
      font-size: 13px;
      color: #536471;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="twitter-context">
    <div class="tw-post-header">
      <div class="tw-post-author">
        <div class="tw-avatar">JD</div>
        <div class="tw-author-info">
          <div class="tw-author-name">John Doe</div>
          <div class="tw-author-handle">@johndoe</div>
        </div>
        <div class="tw-post-time">2h</div>
      </div>
    </div>

    <div class="tw-post-content">
      <div class="tw-post-text">Just found this excellent resource on modern web development practices. Highly recommend checking it out!</div>
      <div class="tw-link-card">
        <div class="tw-link-image"></div>
        <div class="tw-link-info">
          <div class="tw-link-domain">website.com</div>
          <div class="tw-link-title">Best Practices for Modern Web Development</div>
        </div>
      </div>
    </div>

    <div class="tw-actions">
      <div class="tw-action">💬 12</div>
      <div class="tw-action">🔁 24</div>
      <div class="tw-action">❤️ 89</div>
      <div class="tw-action">👁️ 1.2K</div>
    </div>
  </div>
</body>
</html>
