<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Platform Theme Verification</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px 20px;
      max-width: 1400px;
      margin: 0 auto;
      background: #0f1117;
      color: #e8eaf0;
    }
    html[data-theme='light'] body {
      background: #f8f9fa;
      color: #212529;
    }
    h1 { margin-bottom: 8px; text-align: center; }
    .subtitle { color: #9ba3b8; text-align: center; margin-bottom: 40px; }
    html[data-theme='light'] .subtitle { color: #495057; }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      background: #5b8dee;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
    }
    .theme-toggle:hover { opacity: 0.9; }

    .verification-section {
      margin-bottom: 40px;
    }
    .verification-section h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #5b8dee;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .platform-card {
      background: #1e2330;
      border-radius: 8px;
      padding: 16px;
    }
    html[data-theme='light'] .platform-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    .platform-name {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .test-results {
      margin-top: 12px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
    }

    .test-item {
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pass { color: #4ade80; }
    .fail { color: #ef4444; }
    .info { color: #5b8dee; }

    .overall-status {
      background: #22c55e;
      color: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-weight: 700;
      margin-top: 20px;
    }
    .overall-status.failure {
      background: #ef4444;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>

  <h1>🧪 Complete Platform Theme Verification</h1>
  <p class="subtitle">Testing all 8 platforms with dark/light theme switching</p>

  <div class="verification-section">
    <h2>🎯 Platform Frame Verification</h2>
    <div class="platform-grid" id="platformGrid">
      <!-- Platform cards will be generated by JS -->
    </div>
  </div>

  <div class="verification-section">
    <h2>📋 Theme Verification Results</h2>
    <div class="test-results" id="verificationResults"></div>
  </div>

  <div class="overall-status" id="overallStatus">Running tests...</div>

  <script src="platform-frames.js"></script>
  <script>
    // All 8 platforms with theme support
    const platforms = [
      'facebook',
      'twitter',
      'linkedin',
      'reddit',
      'instagram',
      'youtube',
      'tiktok',
      'pinterest'
    ];

    let currentTheme = 'dark';
    const testResults = {};

    function log(message, status = 'info') {
      const div = document.createElement('div');
      div.className = `test-item ${status}`;
      div.textContent = message;
      document.getElementById('verificationResults').appendChild(div);
    }

    function testFrameStructure(platform) {
      const frame = document.querySelector(`.${platform}-context`);
      if (!frame) {
        return { passed: false, message: `Frame not found` };
      }

      // Check if theme class exists
      const hasThemeClass = frame.classList.contains(`${currentTheme}-theme`);
      if (!hasThemeClass) {
        return { passed: false, message: `Missing ${currentTheme}-theme class` };
      }

      // Check for CSS variables
      const style = getComputedStyle(frame);
      const bgColor = style.getPropertyValue('--frame-bg');

      if (!bgColor || bgColor === '') {
        return { passed: false, message: `CSS variables not applied` };
      }

      return { passed: true, message: `✓ Frame structure and theme classes correct` };
    }

    function testThemeColors(platform) {
      const frame = document.querySelector(`.${platform}-context`);
      if (!frame) {
        return { passed: false, message: `Frame not found` };
      }

      const style = getComputedStyle(frame);
      const bgColor = style.getPropertyValue('--frame-bg');
      const textColor = style.getPropertyValue('--frame-text-primary');

      // Check if variables are defined
      if (!bgColor || bgColor === '') {
        return { passed: false, message: `Missing --frame-bg variable` };
      }

      if (!textColor || textColor === '') {
        return { passed: false, message: `Missing --frame-text-primary variable` };
      }

      return { passed: true, message: `✓ Theme colors defined correctly` };
    }

    function testThemeTransition(platform) {
      const frame = document.querySelector(`.${platform}-context`);
      if (!frame) {
        return { passed: false, message: `Frame not found` };
      }

      // Switch theme temporarily
      frame.classList.remove('dark-theme');
      frame.classList.add('light-theme');

      const lightStyle = getComputedStyle(frame);
      const lightBg = lightStyle.getPropertyValue('--frame-bg');

      // Switch back
      frame.classList.remove('light-theme');
      frame.classList.add('dark-theme');

      const darkStyle = getComputedStyle(frame);
      const darkBg = darkStyle.getPropertyValue('--frame-bg');

      // Check if colors are different
      if (lightBg === darkBg) {
        return { passed: false, message: `Theme colors don't change between light/dark` };
      }

      return { passed: true, message: `✓ Theme transition works correctly` };
    }

    function runTestsForPlatform(platform) {
      log(`\n🧪 Testing ${platform.toUpperCase()}`, 'info');
      log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');

      const tests = [
        { name: 'Structure', fn: testFrameStructure },
        { name: 'Colors', fn: testThemeColors },
        { name: 'Transition', fn: testThemeTransition }
      ];

      let platformPassed = true;
      const results = [];

      tests.forEach(test => {
        const result = test.fn(platform);
        results.push({ name: test.name, ...result });
        log(`${test.name}: ${result.message}`, result.passed ? 'pass' : 'fail');
        if (!result.passed) platformPassed = false;
      });

      return { passed: platformPassed, results };
    }

    function updatePlatformCard(platform) {
      const card = document.querySelector(`[data-platform="${platform}"]`);
      if (!card) return;

      const resultElement = card.querySelector('.test-results');
      if (!resultElement) return;

      const results = testResults[platform];
      if (!results) return;

      let html = '';
      results.results.forEach(test => {
        html += `<div class="test-item ${test.passed ? 'pass' : 'fail'}">${test.passed ? '✓' : '✗'} ${test.name}: ${test.message}</div>`;
      });
      resultElement.innerHTML = html;
    }

    function runAllTests() {
      document.getElementById('verificationResults').innerHTML = '';

      let allPassed = true;

      platforms.forEach(platform => {
        const results = runTestsForPlatform(platform);
        testResults[platform] = results;
        if (!results.passed) allPassed = false;
        updatePlatformCard(platform);
      });

      log('\n📊 FINAL RESULTS', 'info');
      log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');

      platforms.forEach(platform => {
        const passed = testResults[platform].passed;
        log(`${platform.toUpperCase()}: ${passed ? '✓ PASSED' : '✗ FAILED'}`, passed ? 'pass' : 'fail');
      });

      const statusElement = document.getElementById('overallStatus');
      if (allPassed) {
        statusElement.textContent = '✅ ALL TESTS PASSED';
        statusElement.className = 'overall-status';
        log('✅ All platform frames working correctly!', 'pass');
      } else {
        statusElement.textContent = '⚠️ SOME TESTS FAILED';
        statusElement.className = 'overall-status failure';
        log('⚠️ Some platforms have issues - see details above', 'fail');
      }
    }

    function createPlatformCards() {
      const grid = document.getElementById('platformGrid');
      grid.innerHTML = '';

      platforms.forEach(platform => {
        const card = document.createElement('div');
        card.className = 'platform-card';
        card.dataset.platform = platform;
        card.innerHTML = `
          <div class="platform-name">${platform.charAt(0).toUpperCase() + platform.slice(1)}</div>
          <div class="test-results">Loading tests...</div>
        `;
        grid.appendChild(card);
      });
    }

    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';

      // Update all platform frames
      platforms.forEach(platform => {
        const frame = document.querySelector(`.${platform}-context`);
        if (frame) {
          frame.classList.remove('dark-theme', 'light-theme');
          frame.classList.add(`${currentTheme}-theme`);
        }
      });

      // Re-run tests after theme switch
      setTimeout(() => {
        runAllTests();
      }, 100);
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      createPlatformCards();
      runAllTests();
    });
  </script>
</body>
</html>
