<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube - Theme-Switchable Frame</title>
  <link rel="stylesheet" href="frames-theme.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      background: var(--frame-bg);
      color: var(--frame-text-primary);
      padding: 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .youtube-context {
      display: flex;
      flex-direction: column;
      min-height: 500px;
      background: var(--youtube-bg);
      border-radius: 8px;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .yt-video-header {
      display: flex;
      align-items: center;
      padding: 16px;
      background: var(--youtube-bg);
      border-bottom: 1px solid var(--youtube-border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .yt-channel-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
      border-radius: 50%;
      margin-right: 12px;
    }

    .yt-channel-meta {
      flex: 1;
    }

    .yt-channel-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--youtube-text-primary);
      transition: color 0.3s ease;
    }

    .yt-subscriber-count {
      font-size: 12px;
      color: var(--youtube-text-secondary);
      margin-top: 2px;
      transition: color 0.3s ease;
    }

    .yt-subscribe-btn {
      padding: 8px 16px;
      background: var(--youtube-accent);
      color: var(--youtube-bg);
      border: none;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .yt-subscribe-btn:hover {
      background: var(--youtube-accent-bg);
    }

    .yt-video-title {
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      color: var(--youtube-text-primary);
      background: var(--youtube-bg);
      transition: color 0.3s ease, background 0.3s ease;
    }

    .yt-video-stats {
      padding: 0 16px 16px;
      font-size: 14px;
      color: var(--youtube-text-secondary);
      background: var(--youtube-bg);
      transition: color 0.3s ease, background 0.3s ease;
    }

    .yt-comments-section {
      flex: 1;
      background: var(--youtube-surface);
      padding: 16px;
      overflow-y: auto;
      transition: background 0.3s ease;
    }

    .yt-comment-header {
      font-size: 16px;
      font-weight: 600;
      color: var(--youtube-text-primary);
      margin-bottom: 16px;
      transition: color 0.3s ease;
    }

    .yt-comment {
      display: flex;
      margin-bottom: 16px;
      background: var(--youtube-bg);
      padding: 12px;
      border-radius: 8px;
      transition: background 0.3s ease;
    }

    .yt-comment-avatar {
      width: 32px;
      height: 32px;
      background: var(--youtube-border);
      border-radius: 50%;
      margin-right: 12px;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .yt-comment-meta {
      flex: 1;
    }

    .yt-comment-author {
      font-size: 13px;
      font-weight: 600;
      color: var(--youtube-text-primary);
      transition: color 0.3s ease;
    }

    .yt-comment-time {
      font-size: 12px;
      color: var(--youtube-text-secondary);
      margin-left: 8px;
      transition: color 0.3s ease;
    }

    .yt-comment-text {
      font-size: 14px;
      color: var(--youtube-text-primary);
      margin-top: 4px;
      line-height: 1.4;
      transition: color 0.3s ease;
    }

    .yt-comment-actions {
      font-size: 12px;
      color: var(--youtube-text-secondary);
      margin-top: 8px;
      transition: color 0.3s ease;
    }

    .yt-link-preview {
      width: 100%;
      height: 180px;
      background: var(--youtube-surface);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
      border: 1px solid var(--youtube-border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .yt-context-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .yt-context-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--youtube-border) 0%, var(--youtube-surface) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--youtube-text-muted);
      font-size: 14px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: var(--youtube-accent);
      color: var(--youtube-bg);
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      z-index: 1000;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--youtube-accent-bg);
    }

    /* Ensure smooth transitions for all theme changes */
    .youtube-context *,
    .youtube-context *::before,
    .youtube-context *::after {
      transition-property: background, color, border-color, background-color;
      transition-duration: 0.3s;
      transition-timing-function: ease;
    }
  </style>
</head>
<body>
  <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle Theme</button>

  <div class="youtube-context">
    <div class="yt-video-header">
      <div class="yt-channel-avatar"></div>
      <div class="yt-channel-meta">
        <div class="yt-channel-name">TechChannel</div>
        <div class="yt-subscriber-count">1.2M subscribers</div>
      </div>
      <button class="yt-subscribe-btn">Subscribe</button>
    </div>
    <div class="yt-video-title">Amazing Tutorial - Learn in 10 Minutes!</div>
    <div class="yt-video-stats">234K views · 3 hours ago</div>
    <div class="yt-comments-section">
      <div class="yt-comment-header">Comments</div>
      <div class="yt-comment">
        <div class="yt-comment-avatar"></div>
        <div class="yt-comment-meta">
          <div>
            <span class="yt-comment-author">User123</span>
            <span class="yt-comment-time">2 hours ago</span>
          </div>
          <div class="yt-comment-text">This was really helpful, thanks!</div>
          <div class="yt-comment-actions">👍 45 · 💬 Reply</div>
        </div>
      </div>
      <div class="yt-comment">
        <div class="yt-link-preview">
          <div class="yt-context-placeholder">🔗 Link Preview</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTheme = 'dark';

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('vista-theme', currentTheme);
    }

    // Initialize with saved theme preference
    const savedTheme = localStorage.getItem('vista-theme') || 'dark';
    currentTheme = savedTheme;
    document.documentElement.setAttribute('data-theme', currentTheme);

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('vista-theme')) {
        currentTheme = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
      }
    });
  </script>
</body>
</html>
