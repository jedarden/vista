<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Integration Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: var(--frame-bg, #1a1a1e);
      color: var(--frame-text-primary, #e4e4e7);
    }

    .test-controls {
      background: var(--frame-surface, #25252a);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--frame-border, #3a3a3f);
    }

    .test-controls button {
      background: var(--frame-accent, #6366f1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      font-size: 14px;
    }

    .test-controls button:hover {
      opacity: 0.9;
    }

    .test-section {
      margin: 20px 0;
    }

    .test-section h2 {
      margin-bottom: 10px;
    }

    .frame-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .test-log {
      background: var(--frame-surface, #25252a);
      border: 1px solid var(--frame-border, #3a3a3f);
      border-radius: 4px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      margin-top: 20px;
    }

    .test-log-entry {
      margin: 5px 0;
      padding: 5px;
      border-left: 3px solid var(--frame-accent, #6366f1);
      padding-left: 10px;
    }

    .test-log-entry.error {
      border-left-color: #ef4444;
    }

    .test-log-entry.success {
      border-left-color: #22c55e;
    }
  </style>
</head>
<body>
  <h1>Theme Subscription Integration Test</h1>

  <div class="test-controls">
    <button id="toggleTheme">Toggle Global Theme</button>
    <button id="createFrames">Create Test Frames</button>
    <button id="clearLog">Clear Log</button>
    <button id="runTests">Run Automated Tests</button>
  </div>

  <div class="test-section">
    <h2>Test Frames (Twitter, Facebook, LinkedIn)</h2>
    <div id="frameContainer" class="frame-container"></div>
  </div>

  <div class="test-section">
    <h2>Test Log</h2>
    <div id="testLog" class="test-log"></div>
  </div>

  <!-- Load the required scripts -->
  <script src="src/public/platform-frames.js"></script>
  <script src="src/public/frames-theme.js"></script>
  <script src="src/public/theme-subscription.js"></script>
  <script src="src/public/app.js"></script>

  <script>
    // Test logging utility
    function log(message, type = 'info') {
      const logDiv = document.getElementById('testLog');
      const entry = document.createElement('div');
      entry.className = `test-log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    // Create test frames
    function createTestFrames() {
      log('Creating test frames...', 'info');
      const container = document.getElementById('frameContainer');
      container.innerHTML = '';

      const testPlatforms = [
        { pid: 'twitter', title: 'Test Twitter Post', description: 'Check out this amazing link!' },
        { pid: 'facebook', title: 'Test Facebook Post', description: 'You have to see this!' },
        { pid: 'linkedin', title: 'Test LinkedIn Post', description: 'Great article on industry trends!' }
      ];

      testPlatforms.forEach(({ pid, title, description }) => {
        try {
          // Simulate the content data structure
          const contentData = {
            title: title,
            description: description,
            domain: `${pid}.com`,
            site: pid.toUpperCase(),
            cardHTML: '', // Would normally be generated by renderPlatformCard
          };

          // Build the frame using the platform-frames system
          const frameHTML = buildContextFrame(pid, contentData, 'dark');

          // Insert into DOM
          const wrapper = document.createElement('div');
          wrapper.innerHTML = frameHTML;
          container.appendChild(wrapper.firstElementChild);

          // Subscribe to theme changes (simulating what app.js does)
          if (typeof window.ThemeSubscription !== 'undefined') {
            const frames = document.querySelectorAll(`[data-platform="${pid}"].context-frame`);
            if (frames.length > 0) {
              const latestFrame = frames[frames.length - 1];
              if (latestFrame.id) {
                window.ThemeSubscription.subscribePlatformFrame(pid, latestFrame.id);
                log(`✓ Created and subscribed ${pid} frame (ID: ${latestFrame.id})`, 'success');
              } else {
                log(`✗ ${pid} frame has no ID`, 'error');
              }
            }
          } else {
            log(`✗ ThemeSubscription API not available for ${pid}`, 'error');
          }
        } catch (error) {
          log(`✗ Error creating ${pid} frame: ${error.message}`, 'error');
        }
      });

      log(`Created ${testPlatforms.length} test frames`, 'success');
    }

    // Toggle global theme
    function toggleGlobalTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      log(`Theme changed: ${currentTheme} → ${newTheme}`, 'info');
    }

    // Clear test log
    function clearLog() {
      document.getElementById('testLog').innerHTML = '';
      log('Test log cleared', 'info');
    }

    // Run automated tests
    function runAutomatedTests() {
      log('=== Starting Automated Tests ===', 'info');

      // Test 1: Check ThemeSubscription API
      if (typeof window.ThemeSubscription === 'undefined') {
        log('Test 1 FAILED: ThemeSubscription API not available', 'error');
        return;
      }
      log('Test 1 PASSED: ThemeSubscription API available', 'success');

      // Test 2: Check PLATFORM_FRAMES
      if (typeof window.PLATFORM_FRAMES === 'undefined') {
        log('Test 2 FAILED: PLATFORM_FRAMES not available', 'error');
        return;
      }
      log('Test 2 PASSED: PLATFORM_FRAMES available', 'success');

      // Test 3: Check buildContextFrame function
      if (typeof window.buildContextFrame !== 'function') {
        log('Test 3 FAILED: buildContextFrame function not available', 'error');
        return;
      }
      log('Test 3 PASSED: buildContextFrame function available', 'success');

      // Test 4: Create a test frame and check it has unique ID
      try {
        const testFrame = buildContextFrame('twitter', { title: 'Test', description: 'Test' }, 'dark');
        const parser = new DOMParser();
        const doc = parser.parseFromString(testFrame, 'text/html');
        const frameElement = doc.body.firstElementChild;

        if (!frameElement.id) {
          log('Test 4 FAILED: Frame does not have unique ID', 'error');
          return;
        }
        log(`Test 4 PASSED: Frame has unique ID: ${frameElement.id}`, 'success');
      } catch (error) {
        log(`Test 4 FAILED: ${error.message}`, 'error');
        return;
      }

      // Test 5: Verify subscriber count increases
      const initialCount = window.ThemeSubscription.subscriberCount;
      createTestFrames();
      setTimeout(() => {
        const finalCount = window.ThemeSubscription.subscriberCount;
        if (finalCount <= initialCount) {
          log(`Test 5 FAILED: Subscriber count did not increase (${initialCount} → ${finalCount})`, 'error');
          return;
        }
        log(`Test 5 PASSED: Subscriber count increased (${initialCount} → ${finalCount})`, 'success');

        // Test 6: Theme change propagates to frames
        log('Test 6: Testing theme propagation...', 'info');
        const framesBefore = document.querySelectorAll('.context-frame.dark-theme');
        log(`Found ${framesBefore.length} dark-theme frames before toggle`, 'info');

        toggleGlobalTheme();

        setTimeout(() => {
          const framesAfter = document.querySelectorAll('.context-frame.light-theme');
          log(`Found ${framesAfter.length} light-theme frames after toggle`, 'info');

          if (framesAfter.length < 3) {
            log(`Test 6 WARNING: Only ${framesAfter.length} frames updated to light theme (expected 3)`, 'error');
          } else {
            log(`Test 6 PASSED: All ${framesAfter.length} frames updated to light theme`, 'success');
          }

          // Toggle back
          toggleGlobalTheme();

          setTimeout(() => {
            const framesBack = document.querySelectorAll('.context-frame.dark-theme');
            log(`Found ${framesBack.length} dark-theme frames after toggle back`, 'info');
            log('=== Automated Tests Complete ===', 'success');
          }, 100);
        }, 100);
      }, 100);
    }

    // Event listeners
    document.getElementById('toggleTheme').addEventListener('click', toggleGlobalTheme);
    document.getElementById('createFrames').addEventListener('click', createTestFrames);
    document.getElementById('clearLog').addEventListener('click', clearLog);
    document.getElementById('runTests').addEventListener('click', runAutomatedTests);

    // Initialize
    log('Theme Integration Test loaded', 'info');
    log('Click "Run Automated Tests" to verify the integration', 'info');
  </script>
</body>
</html>
